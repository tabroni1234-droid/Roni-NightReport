<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中南區民雄廠 - 業績回報系統</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        .section {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #444; }
        textarea {
            width: 100%; height: 100px; padding: 10px;
            border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;
            font-family: monospace; resize: vertical; font-size: 14px;
        }
        button {
            background-color: #1a73e8; color: white; border: none;
            padding: 12px; font-size: 16px; border-radius: 8px;
            cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px;
        }
        button:hover { background-color: #1557b0; }
        .hint { font-size: 0.85em; color: #666; margin-top: 4px; }
        .grid-row {
            display: grid; grid-template-columns: 2.2fr 1fr 1fr 1fr 1fr;
            gap: 6px; align-items: center; margin-bottom: 12px;
            padding-bottom: 12px; border-bottom: 1px dashed #eee;
        }
        .grid-header { font-weight: bold; text-align: center; font-size: 0.85em; color: #666; }
        .grid-header:first-child { text-align: left; }
        .grid-row input[type="number"] {
            width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 14px; box-sizing: border-box;
        }
        .total-box { background: #e8f0fe; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 15px; }
        .item-input-group {
            display: grid; grid-template-columns: 1.8fr 1fr; gap: 10px; margin-bottom: 10px; align-items: center;
        }
        .item-input-group input {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 15px; box-sizing: border-box;
        }
        .off-duty { opacity: 0.3; pointer-events: none; }
        .chk-box { width: 18px; height: 18px; margin-right: 6px; vertical-align: middle; cursor: pointer; }
        .staff-name { font-weight: bold; font-size: 15px; vertical-align: middle; }
    </style>
</head>
<body>

    <h2>業績回報產生器 (鍵盤輸入版)</h2>

    <div class="section">
        <label>1. 請貼上「昨天」的 LINE 業績文字：</label>
        <textarea id="rawInput" placeholder="請在此處完整貼上昨天的回報訊息..."></textarea>
        <button onclick="parseText()">解析文字並生成今日表單</button>
    </div>

    <div id="formContainer" class="section" style="display:none;">
        <label>2. 今日回報日期：</label>
        <input type="text" id="reportDate" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-weight:bold; font-size:15px;">
        <div class="hint">（日期已自動幫您進位 +1 天）</div>
        
        <hr style="border:0; border-top:1px solid #ddd; margin:20px 0;">
        
        <label>個積填寫（請用鍵盤輸入數字，請假請取消勾選）：</label>
        <div class="grid-row" style="border-bottom: 2px solid #ccc; padding-bottom: 6px; margin-bottom: 10px;">
            <div class="grid-header">出勤 / 名字</div>
            <div class="grid-header">新單</div>
            <div class="grid-header">續約</div>
            <div class="grid-header">A專案</div>
            <div class="grid-header">重入</div>
        </div>
        
        <div id="personalArea"></div>

        <div class="total-box">
            <div class="grid-row" style="margin:0; padding:0; border:none;">
                <div style="color:#1557b0;">今日總計：</div>
                <div id="tot_single" style="text-align:center; color:#1557b0;">0</div>
                <div id="tot_renew" style="text-align:center; color:#1557b0;">0</div>
                <div id="tot_project" style="text-align:center; color:#1557b0;">0</div>
                <div id="tot_rejoin" style="text-align:center; color:#1557b0;">0</div>
            </div>
            <div style="margin-top: 10px; font-size: 0.95em; color: #444; border-top: 1px solid #b6d4fe; padding-top: 8px;">
                自動計算上班人數：<span id="workPeopleCount" style="color:#1a73e8; font-size:1.2em; font-weight:bold;">0</span> 人
            </div>
        </div>

        <hr style="border:0; border-top:1px solid #ddd; margin:20px 0;">

        <label>備註各指標進度 (今日新增填右邊)：</label>
        <div id="itemsArea"></div>

        <button onclick="copyResult()" style="background-color: #28a745; margin-top: 25px; padding: 15px; font-size: 18px; border-radius: 10px;">將結果複製到剪貼簿</button>
    </div>

    <script>
        // 員工名單固定
        const staffList = ['Zee', 'Wen', 'Peter', 'Allen', 'Roni'];
        let fixedChange = "0", fixedRefund = "0";

        // 各項需要連動累加的備註項目
        const targetItems = [
            { id: 'ap', label: 'AP', regex: /AP\s*：\s*(\d+)\+(\d+)/ },
            { id: 'br', label: 'BR', regex: /BR\s*：\s*(\d+)\+(\d+)/ },
            { id: 'wi', label: 'WI', regex: /WI\s*：\s*(\d+)\+(\d+)/ },
            { id: 'vip', label: 'VIP', regex: /VIP\s*：\s*(\d+)\+(\d+)/ },
            { id: 're', label: '重新入會', regex: /重新入會：\s*(\d+)\+(\d+)/ },
            { id: 'un', label: '續約', regex: /續約：\s*(\d+)\+(\d+)/ },
            { id: 'ref', label: '推薦名單數', regex: /推薦名單數：\s*(\d+)\+(\d+)/ },
            { id: 'act', label: '限定活動數', regex: /限定活動數：\s*(\d+)\+(\d+)/ },
            { id: 'not', label: '續不綁約/轉續年約', regex: /續不綁約\/轉續年約：\s*(\d+)\+(\d+)/ }
        ];

        // 解析文字核心邏輯
        function parseText() {
            const txt = document.getElementById('rawInput').value;
            if(!txt.trim()) {
                alert('請先貼上昨天的業績文字！');
                return;
            }

            // 1. 日期自動 +1 天
            const dateMatch = txt.match(/中南區民雄廠(\d+)\/(\d+)回報/);
            if(dateMatch) {
                let month = parseInt(dateMatch[1]);
                let day = parseInt(dateMatch[2]);
                let d = new Date(2026, month - 1, day);
                d.setDate(d.getDate() + 1);
                document.getElementById('reportDate').value = `中南區民雄廠${d.getMonth() + 1}/${d.getDate()}回報`;
            } else {
                document.getElementById('reportDate').value = "中南區民雄廠6/13回報";
            }

            // 2. 擷取固定不需要修改的項目
            fixedChange = (txt.match(/換約：(\d+)/) || ["", "0"])[1];
            fixedRefund = (txt.match(/退單：(\d+)/) || ["", "0"])[1];

            // 3. 渲染個人業績輸入框 (點擊自動全選，修改即時計算)
            const pArea = document.getElementById('personalArea');
            pArea.innerHTML = '';
            staffList.forEach(name => {
                const row = document.createElement('div');
                row.className = 'grid-row';
                row.id = `row_${name}`;
                row.innerHTML = `
                    <div>
                        <input type="checkbox" class="chk-box" checked onchange="toggleStaff('${name}')">
                        <span class="staff-name">${name}</span>
                    </div>
                    <input type="number" step="0.5" id="val_${name}_single" value="0" oninput="calculate()" onclick="this.select();">
                    <input type="number" id="val_${name}_renew" value="0" oninput="calculate()" onclick="this.select();">
                    <input type="number" id="val_${name}_project" value="0" oninput="calculate()" onclick="this.select();">
                    <input type="number" id="val_${name}_rejoin" value="0" oninput="calculate()" onclick="this.select();">
                `;
                pArea.appendChild(row);
            });

            // 4. 讀取昨天的 (A+B) 作為今天的基本盤基礎值
            const iArea = document.getElementById('itemsArea');
            iArea.innerHTML = '';
            targetItems.forEach(item => {
                const match = txt.match(item.regex);
                const baseVal = match ? (parseInt(match[1]) + parseInt(match[2])) : 0;
                
                const div = document.createElement('div');
                div.className = 'item-input-group';
                div.innerHTML = `
                    <div style="font-size:14px; font-weight:500;">${item.label} (${baseVal} + )</div>
                    <input type="number" id="add_${item.id}" value="0" data-base="${baseVal}" onclick="this.select();">
                `;
                iArea.appendChild(div);
            });

            // 初始計算
            calculate();
            
            // 展開填寫區
            document.getElementById('formContainer').style.display = 'block';
            document.getElementById('formContainer').scrollIntoView({ behavior: 'smooth' });
        }

        // 出勤勾選連動控制
        function toggleStaff(name) {
            const row = document.getElementById(`row_${name}`);
            const isChecked = row.querySelector('.chk-box').checked;
            const cols = ['single', 'renew', 'project', 'rejoin'];
            
            cols.forEach(type => {
                const inputEl = document.getElementById(`val_${name}_${type}`);
                if(!isChecked) {
                    inputEl.classList.add('off-duty');
                    inputEl.disabled = true;
                    inputEl.value = "0"; // 沒出勤則歸零
                } else {
                    inputEl.classList.remove('off-duty');
                    inputEl.disabled = false;
                }
            });
            calculate();
        }

        // 即時總計與出勤人數計算
        function calculate() {
            let fields = ['single', 'renew', 'project', 'rejoin'];
            fields.forEach(f => {
                let sum = 0;
                staffList.forEach(name => {
                    const row = document.getElementById(`row_${name}`);
                    // 只有勾選上班的人才被納入總計計算
                    if(row && row.querySelector('.chk-box').checked) {
                        sum += parseFloat(document.getElementById(`val_${name}_${f}`).value) || 0;
                    }
                });
                document.getElementById(`tot_${f}`).innerText = sum;
            });

            // 自動計算上班人數
            let workCount = 0;
            document.querySelectorAll('.chk-box').forEach(chk => { if(chk.checked) workCount++; });
            document.getElementById('workPeopleCount').innerText = workCount;
        }

        // 複製結果輸出
        function copyResult() {
            const dateTitle = document.getElementById('reportDate').value;
            const t_s = document.getElementById('tot_single').innerText;
            const t_r = document.getElementById('tot_renew').innerText;
            const t_p = document.getElementById('tot_project').innerText;
            const t_j = document.getElementById('tot_rejoin').innerText;

            let personalText = '';
            staffList.forEach(name => {
                const row = document.getElementById(`row_${name}`);
                // 只有當天有勾選出勤的人，才會出現在最後產生的純文字裡
                if(row && row.querySelector('.chk-box').checked) {
                    const s = document.getElementById(`val_${name}_single`).value || 0;
                    const r = document.getElementById(`val_${name}_renew`).value || 0;
                    const p = document.getElementById(`val_${name}_project`).value || 0;
                    const j = document.getElementById(`val_${name}_rejoin`).value || 0;
                    personalText += `${name}：${s}/${r}/${p}/${j}\n`;
                }
            });

            // 組合備註與活動數據
            let itemsResult = {};
            targetItems.forEach(item => {
                const input = document.getElementById(`add_${item.id}`);
                const addVal = input.value.trim() === "" ? "0" : input.value;
                itemsResult[item.id] = `${input.dataset.base}+${addVal}`;
            });

            const workPeople = document.getElementById('workPeopleCount').innerText;

            // 嚴格還原原始排版格式
            const finalTemplate = 
`${dateTitle}
        單/續約/A專案/重入
總計：${t_s}/${t_r}/${t_p}/${t_j}
個積
${personalText.trim()}

===============
換約：${fixedChange}
=================
退單：${fixedRefund}
=================
備註:
上班人數：${workPeople}
AP ：${itemsResult['ap']}
BR ：${itemsResult['br']}
WI ：${itemsResult['wi']}
VIP：${itemsResult['vip']}
=================
重新入會：${itemsResult['re']}
續約：${itemsResult['un']}
推薦名單數：${itemsResult['ref']}
限定活動數：${itemsResult['act']}
續不綁約/轉續年約：${itemsResult['not']}`;

            // 執行複製到剪貼簿
            navigator.clipboard.writeText(finalTemplate).then(() => {
                alert('🎉 業績回報已成功複製！請直接去 LINE 群組貼上。');
            }).catch(() => {
                alert('複製失敗，請手動全選畫面文字複製。');
            });
        }
    </script>
</body>
</html>
