<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中南區民雄廠 - 業績回報系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=500;700&family=Noto+Serif+TC:wght=500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 全站黑金風格與強制宋體設定 */
        * {
            box-sizing: border-box;
            font-family: 'Noto Serif TC', 'PMingLiU', 'MingLiU', 'Apple LiSung', 'Songti TC', serif !important;
        }
        
        body {
            background-color: #0b0b0c; /* 奢華微光黑 */
            color: #e2e8f0;
            padding: 20px 15px;
            max-width: 650px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }
        
        h2 {
            font-family: 'Cinzel', 'Noto Serif TC', 'PMingLiU', 'Songti TC', serif !important;
            color: #c5a880; /* 香檳金 */
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 5px;
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .sub-title {
            text-align: center;
            color: #8a8a8f;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            border-bottom: 1px solid #222224;
            padding-bottom: 15px;
        }
        
        h3 {
            color: #c5a880;
            margin-top: 0;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* 金色 L 型對角線框 */
        .section {
            background: #111112; 
            padding: 25px 20px;
            margin-bottom: 25px;
            position: relative;
            border: 1px solid #1c1c1e;
        }
        /* 左上角金邊 */
        .section::before {
            content: ''; position: absolute; top: 8px; left: 8px; width: 12px; height: 12px;
            border-top: 2px solid #c5a880; border-left: 2px solid #c5a880; opacity: 0.7;
        }
        /* 右下角金邊 */
        .section::after {
            content: ''; position: absolute; bottom: 8px; right: 8px; width: 12px; height: 12px;
            border-bottom: 2px solid #c5a880; border-right: 2px solid #c5a880; opacity: 0.7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #c5a880; /* 金色標籤 */
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* 輸入框與文字框 */
        textarea {
            width: 100%;
            height: 110px;
            background-color: #0b0b0c;
            color: #ffffff;
            border: 1px solid #2c2c2e;
            padding: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }
        textarea:focus {
            border-color: #c5a880;
            outline: none;
            box-shadow: 0 0 8px rgba(197, 168, 128, 0.2);
        }

        input[type="text"], input[type="number"] {
            -webkit-appearance: none; /* 強制解除 iOS 預設黑體樣式 */
            -moz-appearance: none;
            appearance: none;
            width: 100%;
            padding: 10px;
            background-color: #0b0b0c;
            color: #ffffff;
            border: 1px solid #2c2c2e;
            font-size: 15px;
            text-align: center;
            transition: all 0.3s;
            border-radius: 0px;
            line-height: 1.5;
        }
        input:focus {
            border-color: #c5a880;
            outline: none;
            box-shadow: 0 0 10px rgba(197, 168, 128, 0.3);
        }
        input[readonly] {
            background-color: #1a1a1c !important;
            color: #666666;
            border-color: #1a1a1c;
        }

        /* 業績網格排版 */
        .grid-5 {
            display: grid;
            grid-template-columns: 1.6fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        .grid-header {
            font-weight: bold;
            text-align: center;
            font-size: 0.85rem;
            color: #8a8a8f;
            padding-bottom: 5px;
            border-bottom: 1px solid #2c2c2e;
        }
        .grid-header:first-child { text-align: left; }
        
        .staff-name {
            font-weight: bold;
            color: #ffffff;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* 外廠動態新增區區塊樣式 */
        .ext-consultant-card {
            background: #161618;
            border: 1px dashed #c5a880;
            padding: 15px 12px;
            margin-bottom: 15px;
            position: relative;
        }
        .ext-meta-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .ext-meta-inputs input {
            text-align: left !important;
            padding-left: 10px;
            font-size: 13px;
        }
        .btn-delete-ext {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff5252;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: bold;
            line-height: 22px;
            text-align: center;
            cursor: pointer;
            padding: 0;
        }
        .btn-add-ext {
            background-color: transparent;
            color: #c5a880;
            border: 1px dashed #c5a880;
            padding: 10px;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 25px;
        }
        .btn-add-ext:hover {
            background-color: rgba(197, 168, 128, 0.08);
            color: #c5a880;
            outline: none;
        }

        /* 總計區塊 */
        .total-row {
            border: 1px solid #c5a880;
            padding: 14px 12px;
            font-weight: bold;
            color: #c5a880;
            margin-top: 20px;
            background-color: rgba(197, 168, 128, 0.03);
        }

        /* 備註累積數字提示小字 */
        .base-hint {
            color: #8a8a8f;
            font-size: 0.8rem;
            font-weight: normal;
            margin-left: 4px;
        }

        /* 按鈕：經典黑金方塊 */
        button {
            background-color: #c5a880; /* 金底 */
            color: #0b0b0c; /* 黑字 */
            border: none;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #0b0b0c;
            color: #c5a880;
            outline: 1px solid #c5a880;
        }

        .hint {
            font-size: 0.8em;
            color: #666666;
            margin-top: 6px;
        }
        
        hr {
            border: 0;
            border-top: 1px solid #2c2c2e;
            margin: 25px 0;
        }
    </style>
</head>
<body>

    <h2>RONI FITNESS FACTORY</h2>
    <div class="sub-title">中南區民雄廠 ˙ 業績回報系統</div>

    <div class="section">
        <label for="rawInput">1. 請貼上「昨天」的 LINE 業績文字：</label>
        <textarea id="rawInput" placeholder="請在此處貼上昨天群組的最後一則回報訊息..."></textarea>
        <button onclick="parseAndSetup()">解析文字 ➔ 生成今日表單</button>
    </div>

    <div id="formContainer" class="section" style="display:none;">
        <h3>2. 填寫今日營業成果</h3>
        <br>
        
        <div class="form-group">
            <label>回報日期：</label>
            <input type="text" id="reportDate" style="max-width: 280px; text-align: left;">
            <div class="hint">（系統已自動推算加 1 天）</div>
        </div>

        <hr>
        
        <label>個積填寫 (今日個積已強制歸零)：</label>
        <div class="grid-5">
            <div class="grid-header">名字</div>
            <div class="grid-header">新單</div>
            <div class="grid-header">續約</div>
            <div class="grid-header">A專案</div>
            <div class="grid-header">重入</div>
        </div>
        
        <div id="personalContainer"></div>

        <div id="extConsultantContainer"></div>
        <button type="button" class="btn-add-ext" onclick="addExtConsultantRow()">＋ 新增外廠顧問業績</button>

        <div class="form-group total-row">
            <div class="grid-5" style="margin-bottom: 0;">
                <div style="color: #ffffff;">今日總計:</div>
                <div id="tot_single" style="text-align: center; font-size: 1.05rem;">0</div>
                <div id="tot_renew" style="text-align: center; font-size: 1.05rem;">0</div>
                <div id="tot_project" style="text-align: center; font-size: 1.05rem;">0</div>
                <div id="tot_rejoin" style="text-align: center; font-size: 1.05rem;">0</div>
            </div>
        </div>

        <hr>

        <div class="form-group" style="max-width: 220px;">
            <label>上班人數：</label>
            <input type="number" id="v_work_people" value="0" onclick="this.select();">
        </div>
        
        <label>備註各項目累積進度 (填寫今日新增)：</label>
        <div class="grid-5" style="grid-template-columns: 1.6fr 1fr; max-width: 480px; padding: 12px; border: 1px solid #2c2c2e; background-color: #0f0f10;">
            <div style="font-size:0.85rem; color:#666666;">項目 <span style="color:#8a8a8f;">(昨日累計)</span></div>
            <div style="font-size:0.85rem; color:#c5a880; text-align:center;">今日新增</div>
            
            <div>AP <span id="lbl_ap_base" class="base-hint"></span>：</div><td><input type="number" id="v_ap_add" value="0" onclick="this.select();"><input type="hidden" id="v_ap_base"></td>
            <div>BR <span id="lbl_br_base" class="base-hint"></span>：</div><td><input type="number" id="v_br_add" value="0" onclick="this.select();"><input type="hidden" id="v_br_base"></td>
            <div>WI <span id="lbl_wi_base" class="base-hint"></span>：</div><td><input type="number" id="v_wi_add" value="0" onclick="this.select();"><input type="hidden" id="v_wi_base"></td>
            <div>VIP <span id="lbl_vip_base" class="base-hint"></span>：</div><td><input type="number" id="v_vip_add" value="0" onclick="this.select();"><input type="hidden" id="v_vip_base"></td>
        </div>

        <br>

        <div class="grid-5" style="grid-template-columns: 1.6fr 1fr; max-width: 480px; padding: 12px; border: 1px solid #2c2c2e; background-color: #0f0f10;">
            <div style="font-size:0.85rem; color:#666666;">項目 <span style="color:#8a8a8f;">(昨日累計)</span></div>
            <div style="font-size:0.85rem; color:#c5a880; text-align:center;">今日新增</div>
            
            <div>重新入會 <span id="lbl_re_base" class="base-hint"></span>：</div><td><input type="number" id="v_re_add" value="0" onclick="this.select();"><input type="hidden" id="v_re_base"></td>
            <div>續約 <span id="lbl_un_base" class="base-hint"></span>：</div><td><input type="number" id="v_un_add" value="0" onclick="this.select();"><input type="hidden" id="v_un_base"></td>
            <div>推薦名單數 <span id="lbl_ref_base" class="base-hint"></span>：</div><td><input type="number" id="v_ref_add" value="0" onclick="this.select();"><input type="hidden" id="v_ref_base"></td>
            <div>限定活動數 <span id="lbl_act_base" class="base-hint"></span>：</div><td><input type="number" id="v_act_add" value="0" onclick="this.select();"><input type="hidden" id="v_act_base"></td>
            <div>續不綁/轉續年 <span id="lbl_not_base" class="base-hint"></span>：</div><td><input type="number" id="v_not_add" value="0" onclick="this.select();"><input type="hidden" id="v_not_base"></td>
        </div>

        <button onclick="generateAndCopy()" style="margin-top: 35px;">一鍵複製今日業績</button>
    </div>

    <script>
        const staffList = ['Zee', 'Wen', 'Peter', 'Allen', 'Roni'];
        let fixedChange = "0";
        let fixedRefund = "0";
        let extRowCount = 0; 

        function parseAndSetup() {
            const txt = document.getElementById('rawInput').value;
            if(!txt.trim()){
                alert('請先貼上昨天的業績文字！');
                return;
            }

            document.getElementById('extConsultantContainer').innerHTML = "";

            // 1. 解析日期並+1天
            const dateMatch = txt.match(/中南區民雄廠(\d+)\/(\d+)回報/);
            if(dateMatch) {
                let month = parseInt(dateMatch[1]);
                let day = parseInt(dateMatch[2]);
                let dateObj = new Date(2026, month - 1, day);
                dateObj.setDate(dateObj.getDate() + 1);
                document.getElementById('reportDate').value = `中南區民雄廠${dateObj.getMonth() + 1}/${dateObj.getDate()}回報`;
            } else {
                document.getElementById('reportDate').value = "中南區民雄廠6/14回報";
            }

            // 2. 解析固定欄位
            fixedChange = (txt.match(/換約：(\d+)/) || ["", "0"])[1];
            fixedRefund = (txt.match(/退單：(\d+)/) || ["", "0"])[1];

            // 3. 👑 解析基礎累計值，並動態將加總數字更新到標籤畫面上
            setupBaseValue(txt, /AP\s*：\s*(\d+)\+(\d+)/, 'v_ap_base', 'lbl_ap_base');
            setupBaseValue(txt, /BR\s*：\s*(\d+)\+(\d+)/, 'v_br_base', 'lbl_br_base');
            setupBaseValue(txt, /WI\s*：\s*(\d+)\+(\d+)/, 'v_wi_base', 'lbl_wi_base');
            setupBaseValue(txt, /VIP\s*：\s*(\d+)\+(\d+)/, 'v_vip_base', 'lbl_vip_base');
            setupBaseValue(txt, /重新入會：\s*(\d+)\+(\d+)/, 'v_re_base', 'lbl_re_base');
            setupBaseValue(txt, /續約：\s*(\d+)\+(\d+)/, 'v_un_base', 'lbl_un_base');
            setupBaseValue(txt, /推薦名單數：\s*(\d+)\+(\d+)/, 'v_ref_base', 'lbl_ref_base');
            setupBaseValue(txt, /限定活動數：\s*(\d+)\+(\d+)/, 'v_act_base', 'lbl_act_base');
            setupBaseValue(txt, /續不綁約\/轉續年約：\s*(\d+)\+(\d+)/, 'v_not_base', 'lbl_not_base');

            // 4. 解析上班人數
            const workPeopleMatch = txt.match(/上班人數：(\d+)/);
            if(workPeopleMatch) document.getElementById('v_work_people').value = workPeopleMatch[1];

            // 5. 渲染本廠固定個人業績輸入框 
            const personalContainer = document.getElementById('personalContainer');
            personalContainer.innerHTML = '';
            
            staffList.forEach(name => {
                const row = document.createElement('div');
                row.className = 'grid-5';
                row.innerHTML = `
                    <div class="staff-name">${name}</div>
                    <input type="number" step="0.5" class="p-single" value="0" oninput="calculateTotal()" onclick="this.select();">
                    <input type="number" class="p-renew" value="0" oninput="calculateTotal()" onclick="this.select();">
                    <input type="number" class="p-project" value="0" oninput="calculateTotal()" onclick="this.select();">
                    <input type="number" class="p-rejoin" value="0" oninput="calculateTotal()" onclick="this.select();">
                `;
                personalContainer.appendChild(row);
            });

            // 6. 自動捕捉昨日訊息裡的外廠顧問
            const extRegex = /^([^\s：\(\)\xFF08\xFF09]+)[\(\xFF08]([^\)\xFF09]+)[\)\xFF09]\s*：\s*([\d\.]+)\/([\d\.]+)\/([\d\.]+)\/([\d\.]+)/gm;
            let match;
            while ((match = extRegex.exec(txt)) !== null) {
                let extName = match[1].trim();
                let extFactory = match[2].trim();
                if (!staffList.includes(extName)) {
                    addExtConsultantRowWithData(extName, extFactory);
                }
            }

            // 歸零今日新增填寫格
            document.querySelectorAll('input[id$="_add"]').forEach(el => el.value = "0");

            calculateTotal();

            document.getElementById('formContainer').style.display = 'block';
            document.getElementById('formContainer').scrollIntoView({ behavior: 'smooth' });
        }

        // 👑 升級解析邏輯：解析出昨日基礎與昨日新增，加總後寫入提示標籤
        function setupBaseValue(text, regex, elementId, labelId) {
            const match = text.match(regex);
            if (match) {
                let part1 = parseInt(match[1]) || 0;
                let part2 = parseInt(match[2]) || 0;
                let totalYesterday = part1 + part2;
                
                document.getElementById(elementId).value = totalYesterday;
                document.getElementById(labelId).innerText = `(${totalYesterday})`;
            } else {
                document.getElementById(elementId).value = 0;
                document.getElementById(labelId).innerText = `(0)`;
            }
        }

        function addExtConsultantRow() {
            addExtConsultantRowWithData("", "");
        }

        function addExtConsultantRowWithData(name, factory) {
            extRowCount++;
            const container = document.getElementById('extConsultantContainer');
            const card = document.createElement('div');
            card.className = 'ext-consultant-card';
            card.id = `ext_row_${extRowCount}`;
            
            card.innerHTML = `
                <button type="button" class="btn-delete-ext" onclick="removeExtRow(${extRowCount})">X</button>
                <div class="ext-meta-inputs">
                    <input type="text" class="ext-name" placeholder="外廠顧問名字" value="${name}" onclick="this.select();">
                    <input type="text" class="ext-factory" placeholder="所屬廠館" value="${factory}" onclick="this.select();">
                </div>
                <div class="grid-5" style="margin-bottom:0;">
                    <div style="font-size:12px; color:#8a8a8f; font-weight:bold;">輸入今日業績➔</div>
                    <input type="number" step="0.5" class="p-single ext-p" value="0" oninput="calculateTotal()" onclick="this.select();">
                    <input type="number" class="p-renew ext-p" value="0" oninput="calculateTotal()" onclick="this.select();">
                    <input type="number" class="p-project ext-p" value="0" oninput="calculateTotal()" onclick="this.select();">
                    <input type="number" class="p-rejoin ext-p" value="0" oninput="calculateTotal()" onclick="this.select();">
                </div>
            `;
            container.appendChild(card);
            calculateTotal();
        }

        function removeExtRow(id) {
            const el = document.getElementById(`ext_row_${id}`);
            if(el) {
                el.remove();
                calculateTotal();
            }
        }

        function calculateTotal() {
            let fields = ['single', 'renew', 'project', 'rejoin'];
            let classes = ['.p-single', '.p-renew', '.p-project', '.p-rejoin'];
            
            let sums = { single: 0, renew: 0, project: 0, rejoin: 0 };

            fields.forEach((f, index) => {
                let sum = 0;
                document.querySelectorAll(classes[index]).forEach(input => {
                    sum += parseFloat(input.value) || 0;
                });
                sums[f] = sum;
                document.getElementById(`tot_${f}`).innerText = sum;
            });

            // 連動重入 ➔ 重新入會今日新增
            document.getElementById('v_re_add').value = sums['rejoin'];

            // 連動續約 ➔ 續約今日新增
            document.getElementById('v_un_add').value = sums['renew'];
        }

        function generateAndCopy() {
            const titleDate = document.getElementById('reportDate').value;
            const t_single = document.getElementById('tot_single').innerText;
            const t_renew = document.getElementById('tot_renew').innerText;
            const t_project = document.getElementById('tot_project').innerText;
            const t_rejoin = document.getElementById('tot_rejoin').innerText;

            let personalText = '';
            staffList.forEach((name, index) => {
                const s = document.querySelectorAll('#personalContainer .p-single')[index].value || 0;
                const r = document.querySelectorAll('#personalContainer .p-renew')[index].value || 0;
                const p = document.querySelectorAll('#personalContainer .p-project')[index].value || 0;
                const j = document.querySelectorAll('#personalContainer .p-rejoin')[index].value || 0;
                personalText += `${name}：${s}/${r}/${p}/${j}\n`;
            });

            let extText = '';
            const extCards = document.querySelectorAll('#extConsultantContainer .ext-consultant-card');
            extCards.forEach(card => {
                const name = card.querySelector('.ext-name').value.trim();
                const factory = card.querySelector('.ext-factory').value.trim();
                
                if(!name && !factory) return;
                
                const s = card.querySelector('.p-single').value || 0;
                const r = card.querySelector('.p-renew').value || 0;
                const p = card.querySelector('.p-project').value || 0;
                const j = card.querySelector('.p-rejoin').value || 0;
                extText += `${name}(${factory}）：${s}/${r}/${p}/${j}\n`;
            });

            let finalIndividualText = personalText;
            if(extText) {
                finalIndividualText += '\n' + extText;
            }
            finalIndividualText = finalIndividualText.trim();

            const workPeople = document.getElementById('v_work_people').value;
            
            const getVal = (id) => {
                const b = document.getElementById(`v_${id}_base`).value || 0;
                const a = document.getElementById(`v_${id}_add`).value || 0;
                return `${b}+${a}`;
            };

            const resultFormat = 
`${titleDate}
        單/續約/A專案/重入
總計：${t_single}/${t_renew}/${t_project}/${t_rejoin}
個積
${finalIndividualText}

===============
換約：${fixedChange}
=================
退單：${fixedRefund}
=================
備註:
上班人數：${workPeople}
AP ：${getVal('ap')}
BR ：${getVal('br')}
WI ：${getVal('wi')}
VIP：${getVal('vip')}
=================
重新入會：${getVal('re')}
續約：${getVal('un')}
推薦名單數：${getVal('ref')}
限定活動數：${getVal('act')}
續不綁約/轉續年約：${getVal('not')}`;

            navigator.clipboard.writeText(resultFormat).then(() => {
                alert('🎉 今日業績與累積數據已完美同步並複製！');
            }).catch(err => {
                alert('複製失敗，請手動複製。');
            });
        }
    </script>
</body>
</html>
